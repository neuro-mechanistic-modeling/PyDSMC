---
repos:
  # No jupyter notebooks, pdfs, or pngs please
  - repo: "local"
    hooks:
      - id: "forbid-binary-files"
        name: "Ban specific file types (ipynb, pdf)"
        entry: "Commit rejected: jupyter, pdf and image files are not allowed."
        language: "fail"
        types_or: [ "jupyter", "image", "pdf", "zip" ]
  ### I'd have to put all my prefs into the repo if I wanted to include ruff
  # - repo: "https://github.com/astral-sh/ruff-pre-commit"
  #   rev: "v0.1.14"
  #   hooks:
  #     - id: "ruff"
  #       args: ["--fix"]
  #     - id: "ruff-format"
  ### Tests take time. Maybe do not put this here, but as a CI
  # - repo: "local"
  #   hooks:
  #     - id: "pytest-check"
  #       name: "Run Pytest"
  #       entry: "pytest"
  #       language: "system"
  #       pass_filenames: false
  #       always_run: true  # Ensure tests run even if no python files changed
  - repo: "https://github.com/codespell-project/codespell"
    rev: "v2.4.1"
    hooks:
      - id: "codespell"
        args: ["--ignore-words-list=te,fo,fro"]
  - repo: "https://github.com/gitleaks/gitleaks"
    rev: "v8.24.2"
    hooks:
      - id: "gitleaks"
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "v4.5.0"
    hooks:
      - id: "trailing-whitespace"
      - id: "check-yaml"
      - id: "check-added-large-files"  # Prevent giant files
        args: ["--maxkb=5000"]  # Limit to 5MB
      - id: "check-merge-conflict"
  - repo: "https://github.com/asottile/pyupgrade"
    rev: "v3.21.2"
    hooks:
      - id: "pyupgrade"
        args: ["--py310-plus"]

