[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pydsmc"
description = "Statistical Model Checking for Neural Agents Using the Gymnasium Interface"
dynamic = ["classifiers"]
version = "0.3.8"
requires-python = ">= 3.10"

dependencies = [
  "numpy (>=1.26.4,<3.0.0)",
  "scipy (>=1.13.1,<2.0.0)",
  "gymnasium (>=0.28.1,<2.0.0)",
  "packaging (>=20.0)",
  "pandas (>=2.0.0,<4.0.0)",
]

authors = [
  { name = "Timo P. Gros", email = "timopgros@cs.uni-saarland.de" },
  { name = "Arnd Hartmanns", email = "a.hartmanns@utwente.nl" },
  { name = "Joshua Meyer", email = "joshua.meyer@cs.uni-saarland.de" },
  { name = "Nicola J. Müller", email = "nicola.mueller@dfki.de" },
  { name = "Ivo Hoese", email = "ivho00001@stud.uni-saarland.de" },
]
maintainers = [
  { name = "Joshua Meyer", email = "joshua.meyer@cs.uni-saarland.de" },
]

readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
dev = [
  "pytest (>=9.0.3,<10.0.0)",
  "pgtg (==0.4.1)",
  "pre-commit (>=4.5.0,<5.0.0)",
  "stable-baselines3 (>=2.5.0,<3.0.0)",
  "ipython",
]
examples = [
  "minigrid (>=3.0.0,<4.0.0)",
  "ale-py (>=0.10.0,<0.11.0)",
  "gymnasium-robotics (>=1.4.0,<2.0.0)",
  "sb3-contrib (>=2.8.0,<3.0.0)",
]
docs = [
  "mkdocs-material (>=9.5.0,<10.0.0)",
  "mkdocstrings[python] (>=0.27.0,<1.0.0)",
  "mkdocs-marimo (>=0.2.0,<1.0.0)",
  "ruff",  # used by mkdocstrings to pretty-format rendered signatures (matches project tooling)
]
all = ["pydsmc[dev,examples,docs]"]

[project.urls]
Repository = "https://github.com/neuro-mechanistic-modeling/pydsmc"
Issues = "https://github.com/neuro-mechanistic-modeling/pydsmc/issues"
Paper = "https://doi.org/10.1007/978-3-032-05792-1_8"

[tool.ruff]
respect-gitignore = true
line-length = 100

[tool.ruff.format]
quote-style = "double"
